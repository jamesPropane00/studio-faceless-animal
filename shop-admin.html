<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Supply Admin — Faceless Animal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/shop.css"><style>
.admin-wrap{max-width:1100px;margin:auto;padding:1rem}.admin-top{display:flex;justify-content:space-between;align-items:center;padding:1rem 0}.admin-panel{border:1px solid var(--s-line);background:var(--s-panel);padding:1rem;margin:1rem 0}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.admin-grid input,.admin-grid textarea,.admin-grid select{width:100%;background:#09090c;border:1px solid #39333f;color:#fff;padding:.9rem;font:inherit}.admin-grid textarea,.admin-grid .wide{grid-column:1/-1}.admin-button{background:var(--s-purple);border:0;color:#fff;padding:.85rem 1rem;font-weight:800}.admin-button.ghost{background:#201c25}.admin-list{display:grid;gap:.6rem}.admin-row{display:grid;grid-template-columns:1fr auto;gap:.8rem;border:1px solid var(--s-line);padding:1rem}.admin-row p{color:var(--s-muted);margin:.3rem 0;font-size:.75rem}.admin-actions{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}.admin-actions button,.admin-actions select{padding:.55rem;background:#201c25;color:#fff;border:1px solid #453c4e}.tabs{display:flex;gap:.4rem}.tabs button.active{background:var(--s-purple)}#login-view{max-width:420px;margin:15vh auto}.hidden{display:none!important}@media(max-width:650px){.admin-grid{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr}.admin-top{align-items:flex-start}.admin-top .shop-brand{font-size:.8rem}}</style></head>
<body><main class="admin-wrap"><section id="login-view" class="admin-panel"><p class="eyebrow">Authorized access</p><h1>Supply admin</h1><form id="login-form" class="admin-grid"><input class="wide" name="email" type="email" required placeholder="Admin email"><input class="wide" name="password" type="password" required placeholder="Password"><p id="login-error" class="form-error wide"></p><button class="admin-button wide">Sign in</button></form></section>
<section id="admin-view" class="hidden"><header class="admin-top"><a class="shop-brand" href="store.html">FACELESS <span>ANIMAL</span><small>SUPPLY ADMIN</small></a><button id="signout" class="admin-button ghost">Sign out</button></header><nav class="tabs"><button class="admin-button active" data-tab="products">Products</button><button class="admin-button ghost" data-tab="orders">Orders</button></nav>
<section id="products-tab"><form id="product-form" class="admin-panel admin-grid"><input type="hidden" name="id"><input name="title" required placeholder="Title"><input name="sku" required placeholder="SKU"><textarea class="wide" name="description" rows="4" placeholder="Description"></textarea><input name="price" type="number" min="0" step=".01" required placeholder="Price, e.g. 45.00"><input name="quantity" type="number" min="0" required placeholder="Quantity"><input name="condition" value="New" placeholder="Condition"><input name="category" required placeholder="Category"><input name="shipping_price" type="number" min="0" step=".01" value="0" placeholder="Shipping price"><select name="state"><option>available</option><option>reserved</option><option>sold</option><option>inactive</option></select><label><input name="local_pickup" type="checkbox"> Local pickup available</label><label><input name="published" type="checkbox"> Published</label><label class="wide">Product photos (select multiple)<input name="images" type="file" accept="image/*" multiple></label><p id="product-error" class="form-error wide"></p><div class="wide admin-actions"><button class="admin-button">Save product</button><button type="button" id="reset-product" class="admin-button ghost">Clear</button></div></form><div id="product-list" class="admin-list"></div></section>
<section id="orders-tab" class="hidden"><div class="admin-panel"><label>Status <select id="order-filter"><option value="">All</option><option>paid</option><option>pending</option><option>shipped</option><option>completed</option><option>refunded</option><option>canceled</option></select></label></div><div id="order-list" class="admin-list"></div></section></section></main>
<script>window.__FAS_CONFIG=window.__FAS_CONFIG||{}</script><script src="/assets/js/env.js" onerror="void 0"></script><script type="module" src="/assets/js/shop-admin.js"></script></body></html>
